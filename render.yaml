services:
  - type: web
    name: erp-enterprisecloud-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INVITE_REDIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
